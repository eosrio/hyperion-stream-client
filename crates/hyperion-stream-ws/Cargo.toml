[package]
name = "hyperion-stream-ws"
description = "Tokio, Tungstenite, JSON and Rustls adapter for Hyperion native streaming"
readme = "README.md"
exclude = ["tests/**"] # Shared conformance runs from the repository workspace.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hyperion-stream-core = { path = "../hyperion-stream-core", version = "0.1.0" }
tokio = { version = "1.54.1", default-features = false, features = ["net", "time", "macros", "rt", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true

